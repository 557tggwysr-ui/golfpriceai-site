name: "His & Hers: render episodes"
# Renders the His & Hers comic episodes (scripts/agent_heist.py) with a commentator voice and puts the
# videos on the "his-hers-tests" release, ready to watch. Free: Piper voices are open-source and run here.
on:
  workflow_dispatch:
    inputs:
      episodes:
        description: "Episode numbers, comma-separated"
        default: "2,3"
      voices:
        description: "Piper voices to try, comma-separated (British English)"
        default: "en_GB-semaine-medium#obadiah~deep,en_GB-alan-medium~deep,en_GB-vctk-medium#p254~deep"
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q pillow numpy piper-tts
      - name: Voices
        run: |
          mkdir -p .voices
          for v in $(echo "${{ inputs.voices }}" | tr ',' '\n' | sed 's/[#~].*//' | sort -u); do
            name=$(echo "$v" | cut -d- -f2); q=$(echo "$v" | cut -d- -f3)
            base="https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_GB/$name/$q/$v"
            curl -sSfL "$base.onnx" -o ".voices/$v.onnx" && curl -sSfL "$base.onnx.json" -o ".voices/$v.onnx.json" || echo "couldn't get $v"
          done
          ls -la .voices
      - name: Render
        env:
          HEIST_VOICES: .voices
        run: |
          mkdir -p out
          for e in $(echo "${{ inputs.episodes }}" | tr ',' ' '); do
            for v in $(echo "${{ inputs.voices }}" | tr ',' ' '); do
              short=$(echo "$v" | sed 's/^en_GB-//; s/-medium//; s/-high//; s/[#~]/-/g')
              python scripts/agent_heist.py --ep "$e" --voice "$v" --out "out/his-hers-ep$(printf %02d $e)-$short.mp4"
            done
          done
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view his-hers-tests >/dev/null 2>&1 || gh release create his-hers-tests --title "His & Hers: test renders" --notes "Comic episodes with commentator voices, for John to choose from." --prerelease
          gh release upload his-hers-tests out/*.mp4 out/*.jpg --clobber
          echo "### His & Hers renders" >> $GITHUB_STEP_SUMMARY
          for f in out/*.mp4; do echo "- [$(basename $f)](https://github.com/${{ github.repository }}/releases/download/his-hers-tests/$(basename $f))" >> $GITHUB_STEP_SUMMARY; done
