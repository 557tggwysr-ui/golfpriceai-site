name: "Agent: search-to-page engine"

# Weekly: reads Search Console and ranks the pages to build or improve,
# checks competitors' public sitemaps for new pages (competitor watch), and
# checks technical health: structured data, indexing, sitemaps, mobile speed.
# Public list (queries and pages only): data/agents/seo-opportunities.json
# Full numbers go privately to the owner by email.
on:
  schedule:
    - cron: '10 5 * * 1'
  workflow_dispatch: {}

concurrency: { group: agents-commit, cancel-in-progress: false }

jobs:
  run:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    env: { PYTHONDONTWRITEBYTECODE: "1" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install --quiet google-auth requests
      - name: Find search opportunities
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          PSI_API_KEY: ${{ secrets.PSI_API_KEY }}
        run: python scripts/agent_search.py
      - name: Save the list
        run: |
          git config user.name "golfpriceai-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/agents/seo-opportunities.json data/agents/competitor-watch.json data/agents/seo-health.json
          if ! git diff --quiet --cached; then
            git commit -m "Agent: search opportunities"
            for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep $((i*5)); done
          fi
