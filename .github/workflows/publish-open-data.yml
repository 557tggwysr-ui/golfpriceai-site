name: Publish open data

# Every Monday, copies the two open-data CSVs from /prices/data/ to the
# Hugging Face and Kaggle listings, so they stay current with no manual
# uploads. Can also be run by hand ("Run workflow").
#
# Needs these repository secrets (Settings -> Secrets and variables ->
# Actions). A site with no key set is skipped, not failed:
#   HF_TOKEN            Hugging Face access token with write access
#   KAGGLE_API_TOKEN    Kaggle API token
#     or KAGGLE_USERNAME + KAGGLE_KEY (from an older kaggle.json file)
#
# Zenodo is the permanent, citable copy and is updated by hand now and then.
on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Gather files
        run: |
          mkdir -p /tmp/opendata
          cp prices/data/golf-prices-uk.csv prices/data/golf-price-history-uk.csv /tmp/opendata/
          cp scripts/kaggle-dataset-metadata.json /tmp/opendata/dataset-metadata.json
          wc -l /tmp/opendata/*.csv

      - name: Update Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then echo "No HF_TOKEN secret yet - skipping Hugging Face."; exit 0; fi
          pip install --quiet huggingface_hub
          python - <<'PY'
          import datetime, os
          from huggingface_hub import HfApi
          HfApi(token=os.environ["HF_TOKEN"].strip().strip('"')).upload_folder(
              folder_path="/tmp/opendata", repo_id="GolfPriceAI/uk-golf-prices", repo_type="dataset",
              allow_patterns=["*.csv"], commit_message=f"Weekly update {datetime.date.today().isoformat()}")
          print("Hugging Face updated.")
          PY

      - name: Update Kaggle
        # Runs even if the Hugging Face step failed, so one bad key never blocks the other.
        if: ${{ !cancelled() }}
        env:
          T: ${{ secrets.KAGGLE_API_TOKEN }}
          U: ${{ secrets.KAGGLE_USERNAME }}
          K: ${{ secrets.KAGGLE_KEY }}
        run: |
          T=$(echo "$T" | tr -d '[:space:]"')
          if [ -n "$T" ]; then export KAGGLE_API_TOKEN="$T"
          elif [ -n "$U" ] && [ -n "$K" ]; then export KAGGLE_USERNAME="$U" KAGGLE_KEY="$K"
          else echo "No Kaggle secrets yet - skipping Kaggle."; exit 0; fi
          pip install --quiet --upgrade kaggle
          kaggle datasets version -p /tmp/opendata -m "Weekly update $(date -u +%F)"
          echo "Kaggle updated."
