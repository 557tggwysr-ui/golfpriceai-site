name: "Agent: data story"

# 1st of each month: the most striking finding in our own price data, with a
# chart and a draft press note (data/agents/story.json, social/stories/).
on:
  schedule:
    - cron: '40 6 1 * *'
  workflow_dispatch: {}

concurrency: { group: agents-commit, cancel-in-progress: false }

jobs:
  run:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    env: { PYTHONDONTWRITEBYTECODE: "1" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install --quiet pillow
      - name: Find this month's story
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: python scripts/agent_story.py
      - name: Save it
        run: |
          git config user.name "golfpriceai-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/agents/story.json social/stories/
          if ! git diff --quiet --cached; then
            git commit -m "Agent: monthly data story"
            for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep $((i*5)); done
          fi
