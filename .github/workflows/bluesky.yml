name: Post genuine drops to Bluesky

on:
  # Posting now happens at the end of every "Update golf deals" run (every
  # 6 hours), because GitHub kept skipping this schedule. Run this by hand
  # any time for an extra post.
  workflow_dispatch: {}

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Post one new drop
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: |
          python scripts/bluesky_post.py
          git config user.name "golfpriceai-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/bluesky-state.json 2>/dev/null || true
          if ! git diff --quiet --cached; then
            git commit -m "Bluesky post"
            git pull --rebase
            git push
          fi
