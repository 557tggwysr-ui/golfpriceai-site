name: Publish connector to MCP Registry

# Manual only: Actions tab > "Publish connector to MCP Registry" > Run workflow.
# Lists the GolfPrice AI connector (server.json in the repo root) in the
# official MCP Registry, which many AI apps and connector directories read.
# Signs in with GitHub's own short-lived token: no secret to set up.
# To update the listing later, change "version" in server.json and run again.
on:
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Sign in to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish
