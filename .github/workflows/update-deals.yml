name: Update golf deals

on:
  schedule:
    # Runs every 6 hours. Change the cron expression to adjust frequency.
    - cron: '0 */6 * * *'
  workflow_dispatch: {}  # lets you also trigger it manually from the GitHub Actions tab

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"  # no __pycache__ folders left behind
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install picture tools (for share cards)
        run: pip install --quiet pillow

      - name: Run deal refresh script
        env:
          CJ_API_TOKEN: ${{ secrets.CJ_API_TOKEN }}
          CJ_CID: ${{ secrets.CJ_CID }}
          AWIN_API_TOKEN: ${{ secrets.AWIN_API_TOKEN }}
          AWIN_PUBLISHER_ID: ${{ secrets.AWIN_PUBLISHER_ID }}
          AWIN_ADVERTISER_ID: ${{ secrets.AWIN_ADVERTISER_ID }}
          AWIN_CLICKGOLF_FEED_URL: ${{ secrets.AWIN_CLICKGOLF_FEED_URL }}
          AWIN_MAJORGOLF_FEED_URL: ${{ secrets.AWIN_MAJORGOLF_FEED_URL }}
          AWIN_CALLAWAY_FEED_URL: ${{ secrets.AWIN_CALLAWAY_FEED_URL }}
          AWIN_AFFORDABLEGOLF_FEED_URL: ${{ secrets.AWIN_AFFORDABLEGOLF_FEED_URL }}
          AWIN_SCOTTSDALEGOLF_FEED_URL: ${{ secrets.AWIN_SCOTTSDALEGOLF_FEED_URL }}
          AWIN_CALLAWAYPREOWNED_FEED_URL: ${{ secrets.AWIN_CALLAWAYPREOWNED_FEED_URL }}
        run: python scripts/update_deals.py

      - name: Commit updated catalog and price pages
        run: |
          git config user.name "golfpriceai-bot"
          git config user.email "bot@users.noreply.github.com"
          # Everything the refresh writes: data files, price pages, forwarded
          # old pages and the sitemaps.
          git add -A data prices products wishlist fourball play demand societies assets/cards sitemap.xml sitemap-pages.xml sitemap-prices.xml
          git diff --quiet --cached || git commit -m "Automated catalog refresh"
          git pull --rebase
          git push

      - name: Check every generated file was published
        run: |
          # Lesson learned: files that are generated but never added to git
          # silently never go live. Fail loudly instead.
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::The refresh created or changed files that were not published:"
            git status --porcelain
            exit 1
          fi

      - name: Tell Bing about changed price pages (IndexNow)
        run: python scripts/indexnow.py

      - name: Send price-drop alerts and the Friday email
        # After the pages are live, so the links in the emails show the new
        # prices. The Friday "Genuine Drops" email has its own workflow at
        # 4pm UK time (friday-email.yml); this only sends it if that failed.
        # Saves only model prices and counts (no emails) to
        # data/alerts-state.json.
        continue-on-error: true
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          ALERTS_SECRET: ${{ secrets.ALERTS_SECRET }}
        run: |
          python scripts/alerts.py
          python scripts/digest.py
          # Demand Index: anonymous counts only (no emails), turned into the
          # /demand/ page by the next 6-hourly refresh.
          python scripts/demand_index.py fetch || true
          git add data/alerts-state.json data/demand/signals.json 2>/dev/null || true
          if ! git diff --quiet --cached; then
            git commit -m "Alert reference prices"
            git pull --rebase
            git push
          fi
