name: Update golf deals

on:
  schedule:
    # Runs every 6 hours. Change the cron expression to adjust frequency.
    - cron: '0 */6 * * *'
  workflow_dispatch: {}  # lets you also trigger it manually from the GitHub Actions tab

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run deal refresh script
        env:
          CJ_API_TOKEN: ${{ secrets.CJ_API_TOKEN }}
          CJ_CID: ${{ secrets.CJ_CID }}
          AWIN_API_TOKEN: ${{ secrets.AWIN_API_TOKEN }}
          AWIN_PUBLISHER_ID: ${{ secrets.AWIN_PUBLISHER_ID }}
          AWIN_ADVERTISER_ID: ${{ secrets.AWIN_ADVERTISER_ID }}
          AWIN_CLICKGOLF_FEED_URL: ${{ secrets.AWIN_CLICKGOLF_FEED_URL }}
          AWIN_MAJORGOLF_FEED_URL: ${{ secrets.AWIN_MAJORGOLF_FEED_URL }}
          AWIN_CALLAWAY_FEED_URL: ${{ secrets.AWIN_CALLAWAY_FEED_URL }}
        run: python scripts/update_deals.py

      - name: Commit updated catalog
        run: |
          git config user.name "golfpriceai-bot"
          git config user.email "bot@users.noreply.github.com"
          # Every data file the pipeline actually produces — previously
          # only products.json was staged here, meaning price-history,
          # stock-history, price-index, bundles, and outfits were being
          # generated correctly every run but silently discarded, since
          # git never tracked them. This is the fix.
          git add data/products.json data/price-history.json data/stock-history.json data/price-index.json data/bundles.json data/outfits.json
          git diff --quiet --cached || git commit -m "Automated catalog refresh"
          # Guards against a race condition (another run, or a manual
          # GitHub upload, landing between checkout and push) — pulls
          # and replays this commit on top of the latest remote state
          # instead of failing outright, same failure seen today.
          git pull --rebase origin main
          git push
