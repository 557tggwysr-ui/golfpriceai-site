name: Monthly UK Golf Price Report email

on:
  schedule:
    # 9:15am UTC every morning. scripts/press_email.py only sends once per
    # new edition (published on the 1st), so most mornings it does nothing.
    - cron: '15 9 * * *'
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Send the report email (if a new edition is out)
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          ALERTS_SECRET: ${{ secrets.ALERTS_SECRET }}
        run: |
          python scripts/press_email.py
          git config user.name "golfpriceai-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/alerts-state.json 2>/dev/null || true
          if ! git diff --quiet --cached; then
            git commit -m "Report email sent"
            git pull --rebase
            git push
          fi
