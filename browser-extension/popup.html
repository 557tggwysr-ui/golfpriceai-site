<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>GolfPrice AI</title>
<style>
  body{margin:0;width:300px;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#16241c}
  .top{background:#16241c;color:#fff;padding:12px 14px;font-weight:800;font-size:15px}.top b{color:#3fae29}
  .top small{display:block;font-weight:500;font-size:12px;color:#cfd8d2;margin-top:2px}
  main{padding:12px 14px}
  p{margin:0 0 10px;font-size:13px;color:#4a554e}
  label{display:block;font-weight:700;font-size:13px;margin:12px 0 4px}
  input[type=email]{box-sizing:border-box;width:100%;font:inherit;font-size:13px;padding:8px 9px;border:1.5px solid #cfd8d2;border-radius:8px}
  .chk{display:flex;gap:8px;align-items:flex-start;font-weight:500;margin-top:12px}
  .saved{color:#2f8a1f;font-size:12px;min-height:16px;margin:4px 0 0}
  .links{border-top:1px solid #e7e9e5;margin-top:12px;padding-top:10px;display:grid;gap:6px}
  .links a{color:#2f8a1f;font-weight:700;font-size:13px;text-decoration:none}
</style>
</head>
<body>
<div class="top">Golf<b>Price</b> AI<small>UK golf prices, checked every 6 hours</small></div>
<main>
  <p>Open a golf product page at a UK golf shop and we’ll show the lowest new UK price, its price history and a fair pre-owned price.</p>
  <label for="email">Email for one-tap price alerts</label>
  <input id="email" type="email" placeholder="you@example.com" autocomplete="email">
  <label class="chk"><input id="auto" type="checkbox"> <span>Open the panel automatically on product pages</span></label>
  <p class="saved" id="saved"></p>
  <div class="links">
    <a href="https://golfpriceai.com/prices/drops/?utm_source=extension&utm_medium=browser&utm_campaign=popup" target="_blank">Price drops today →</a>
    <a href="https://golfpriceai.com/price-check.html?utm_source=extension&utm_medium=browser&utm_campaign=popup" target="_blank">Is this a good price? →</a>
    <a href="https://golfpriceai.com/extension/?utm_source=extension&utm_medium=browser&utm_campaign=popup#privacy" target="_blank">Privacy and how it works →</a>
  </div>
</main>
<script src="popup.js"></script>
</body>
</html>
