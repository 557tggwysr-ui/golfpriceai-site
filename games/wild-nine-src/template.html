  /* Big screens: an unfolded foldable (iPhone Duo and the like), tablets and PCs. The course gets the big

  /* Unfolded and held upright (taller than wide): one column, just wider, so the hole gets the whole width. */
  @media (min-width:640px) and (max-aspect-ratio:1/1) {
    .app { max-width:760px; }
    #stage { margin:0 12px; }
    .clubs .club { font-size:15px; padding:10px 0; }

  @media (min-width:700px) and (min-height:540px) and (min-aspect-ratio:1/1) {
